name: Build experimental image-to-video container (no GPU)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'video/**'
      - '.github/workflows/build-video.yml'
# A newer build replaces an older in-progress build rather than racing to publish the same tag.
concurrency:
  group: video-pilot-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Build and publish Linux AMD64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: video/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.OWNER }}/synthetic-muse-video-pilot:0.2
          cache-from: type=gha
          cache-to: type=gha,mode=max
