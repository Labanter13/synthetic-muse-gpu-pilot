name: Build Kandinsky Lite experimental pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kandinsky/**'
      - '.github/workflows/build-kandinsky.yml'
permissions:
  contents: read
  packages: write
concurrency:
  group: kandinsky-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase registry namespace
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Build and publish AMD64 without using Salad GPU
        uses: docker/build-push-action@v6
        with:
          context: .
          file: kandinsky/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.OWNER }}/synthetic-muse-kandinsky-pilot:0.4
          cache-from: type=gha
          cache-to: type=gha,mode=max
