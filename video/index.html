<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic Muse | Video Pilot</title>
<style>body{font-family:system-ui,sans-serif;background:#10141c;color:#ecf0f5;max-width:680px;margin:45px auto;padding:20px}h1{font-size:30px}p,small{color:#aeb8ca}label{display:block;margin:16px 0 6px}input,button{font:inherit}input[type=password],input[type=file],input[type=number]{display:block;width:100%;box-sizing:border-box;background:#202837;color:#fff;padding:12px;border:1px solid #526070;border-radius:9px}button{background:#37b29a;color:#061b19;padding:12px 18px;border:0;border-radius:9px;cursor:pointer;font-weight:700}button:disabled{opacity:.4}pre{background:#202837;padding:16px;overflow:auto;white-space:pre-wrap;border-radius:8px}video{width:100%;max-width:500px}</style></head>
<body><h1>Synthetic Muse — Video Pilot</h1><p>Experimental image-to-video, non-explicit. SVD 14 frames at 7 fps (~2 seconds). It does not follow text prompts.</p>
<label>Private API key (stored only in this tab)</label><input id="key" type="password" autocomplete="off" placeholder="Enter PILOT_API_KEY">
<label>Reference image (JPG or PNG, up to 8 MB)</label><input id="image" type="file" accept="image/png,image/jpeg" />
<label>Generation steps (8–30)</label><input id="steps" type="number" min="8" max="30" value="16">
<label>Motion strength (1–200)</label><input id="motion" type="number" min="1" max="200" value="90">
<p><button id="go">Generate one short video</button></p><pre id="state">Upload an image and click Generate.</pre><button id="save" hidden>Download MP4</button>
<script>
const key=()=>document.getElementById('key').value;
const out=document.getElementById('state');
const go=document.getElementById('go');
let job=null,ticker=null;
const message=x=>out.textContent=typeof x==='string'?x:JSON.stringify(x,null,2);
async function poll(){
 try{
 const r=await fetch('/job',{headers:{'x-api-key':key()},cache:'no-store'});
 const j=await r.json();message(j);
 if(!r.ok)throw Error(j.detail||r.status);
 if(j.status==='completed'){clearInterval(ticker);go.disabled=false;job=j.job_id;document.getElementById('save').hidden=false;}
 if(j.status==='failed'){clearInterval(ticker);go.disabled=false;}
 }catch(e){message(String(e));clearInterval(ticker);go.disabled=false;}
}
go.addEventListener('click',async()=>{
 if(!key()||!document.getElementById('image').files.length){message('Enter an API key and choose an image first.');return;}
 go.disabled=true;document.getElementById('save').hidden=true;
 const body=new FormData();body.append('image',document.getElementById('image').files[0]);body.append('steps',document.getElementById('steps').value);body.append('motion',document.getElementById('motion').value);
 try{const r=await fetch('/generate',{method:'POST',headers:{'x-api-key':key()},body});const j=await r.json();if(!r.ok)throw Error(j.detail||r.status);message(j);ticker=setInterval(poll,5000);}catch(e){message(String(e));go.disabled=false;}
});
document.getElementById('save').addEventListener('click',async()=>{
 try{const r=await fetch('/download/'+job,{headers:{'x-api-key':key()}});if(!r.ok)throw Error(await r.text());const blob=await r.blob();const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='synthetic-muse-pilot.mp4';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);}catch(e){message(String(e));}
});
</script></body></html>
